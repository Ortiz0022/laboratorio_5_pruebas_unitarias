<!doctype html>
<html>

<head>
  <title>Chat Socket.IO UNA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font: 13px Helvetica, Arial;
    }

    form {
      background: #000;
      padding: 3px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    form input {
      border: 0;
      padding: 10px;
    }

    form button {
      width: 10%;
      background: rgb(130, 224, 255);
      border: none;
      padding: 10px;
    }

    #messages {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    #messages li {
      padding: 5px 10px;
    }

    #messages li:nth-child(odd) {
      background: #eee;
    }

    #messages {
      margin-bottom: 40px
    }

    #nombre,
    #m {
      display: inline-block;
    }

    #m {
      width: 69%;
      margin-right: 4px;
    }

    #nombre {
      width: 20%
    }
  </style>
</head>

<body>
  <ul id="messages"></ul>
  <form action="">
    <input id="nombre" autocomplete="off" placeholder="Username" />
    <input id="m" autocomplete="off" placeholder="Escriba un mensaje" /><button>Send</button>
  </form>
  <script src="https://cdn.socket.io/4.7.2/socket.io.js"></script>
  <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
  <script>

    var colorHexTxt = "";

    // genera colores aleatorios en hexadeximal
    function getRandomColor() {
      var letters = '0123456789ABCDEF';
      var color = '#';
      for (var i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }

      return color;
    }

    $(function () {
      var socket = io();

      // emite evento al servidor

      $('form').submit(function () {
        var nombreTxt = $('#nombre').val() || "Anomimo";
        var mensajeTxt = $('#m').val();

        if (colorHexTxt == "") {
          colorHexTxt = getRandomColor();
        }

        var jsonMsg = { nombre: nombreTxt, mensaje: mensajeTxt, color: colorHexTxt };
        socket.emit('Evento-Mensaje-Server', JSON.stringify(jsonMsg));
        $('#m').val('');
        return false;
      });

      // ... (resto del código) ...

      socket.on('Evento-Mensaje-Server', function (msg) {
        var msgJson = JSON.parse(msg);
        var mensaje = String(msgJson.mensaje || "").trim();
        // No mostrar mensajes vacios o rechazados
        if (mensaje === '') {
          return;
        }

        var nuevoMensaje = $('<li>');

        // Mostrar el nombre sin interpretar código HTML
        var nombre = $('<b>').text(msgJson.nombre + ': ');
        nuevoMensaje.append(nombre);

        // Identificar si el mensaje contiene una URL válida
        var url;

        try {
          url = new URL(mensaje);
        } catch (error) {
          url = null;
        }

        if (url && ['http:', 'https:'].includes(url.protocol)) {

          var ruta = url.pathname.toLowerCase();

          if (/\.(jpg|jpeg|png|gif|webp)$/.test(ruta)) {
            // Mostrar una imagen
            var imagen = $('<img>')
              .attr('src', url.href)
              .css('max-width', '300px');

            nuevoMensaje.append(imagen);

          } else if (/\.(mp4|webm|ogg)$/.test(ruta)) {
            // Mostrar un reproductor de video
            var video = $('<video controls>')
              .attr('src', url.href)
              .css('max-width', '400px');

            nuevoMensaje.append(video);

          } else {
            nuevoMensaje.append(document.createTextNode(mensaje));
          }

        } else {
          // Mostrar texto normal sin ejecutar scripts
          nuevoMensaje.append(document.createTextNode(mensaje));
        }

        $('#messages').append(nuevoMensaje);
        window.scrollTo(0, document.body.scrollHeight);
      });

    });
  </script>
</body>

</html>
